spring.application.name=finops-backend
server.port=${SERVER_PORT:8080}

# Only non-sensitive operational endpoints are exposed during this foundation phase.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Database configuration is deliberately kept in the opt-in `database` profile.
# This default profile lets the application and its health endpoint run without
# inventing credentials, a database, or changes to the frozen schema.

