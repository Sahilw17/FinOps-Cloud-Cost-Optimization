# Activate with SPRING_PROFILES_ACTIVE=database and Maven profile -Pdatabase.
# Set all DB_* values in the runtime environment; never commit them.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finops_assistant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}

# The database schema is frozen: Hibernate and SQL initialization must not alter it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# When this profile is active, /actuator/health includes actual datasource health.
management.health.db.enabled=true
